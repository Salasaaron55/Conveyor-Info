<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conveyor Map – SAT4 (Web Starter)</title>
  <style>
    :root{
      --bg:#0b0c0f; --panel:#12141a; --text:#e6e9ef; --muted:#9aa3b2; --accent:#4f8cff; --accent2:#26c281; --danger:#ff5c7a;
      --ring: #4f8cff55; --card:#171922; --highlight: #ffd16699;
    }
    *{box-sizing:border-box}
    html,body{height:100%;}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}

    .app{display:grid;grid-template-columns:320px 1fr; height:100vh;}
    .sidebar{background:var(--panel); border-right:1px solid #1f2330; padding:16px; position:sticky; top:0; height:100vh; overflow:auto;}
    .sidebar h1{font-size:18px;margin:0 0 8px}
    .sidebar .sub{color:var(--muted); font-size:12px; margin-bottom:16px}

    .field{margin:10px 0}
    .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
    .field input,.field select,.field textarea{width:100%; padding:8px 10px; background:#0e1118; color:var(--text); border:1px solid #212636; border-radius:10px; outline:none}
    .field textarea{resize:vertical; min-height:60px}

    .kpis{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0 12px}
    .kpis .k{background:var(--card); border:1px solid #23283a; border-radius:14px; padding:10px}
    .k .t{color:var(--muted); font-size:11px}
    .k .v{font-weight:600; font-size:16px; margin-top:2px}

    .actions{display:flex; gap:8px; margin:10px 0 2px}
    .btn{appearance:none; border:1px solid #273048; background:#131724; color:var(--text); padding:8px 10px; border-radius:12px; cursor:pointer}
    .btn.primary{background:var(--accent); border-color:transparent; color:white}
    .btn.ghost{background:#0f1320}

    .mapWrap{position:relative; overflow:auto; height:100vh;}
    .map{position:relative; width:2000px; height:1200px; margin:0; background:#0f1117;}
    .map img.bg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0.35;}

    /* Marker buttons */
    .marker{position:absolute; transform:translate(-50%,-50%); padding:4px 6px; border-radius:10px; border:1px solid #2a334d; background:#121727; color:#d9e1f2; font-size:12px; cursor:pointer; box-shadow:0 0 0 2px transparent;}
    .marker:hover{border-color:#3e4c73}
    .marker.selected{box-shadow:0 0 0 3px var(--ring); background:#182040}
    .marker .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent2); margin-right:6px}

    .legend{margin-top:12px; display:flex; gap:8px; align-items:center; color:var(--muted); font-size:12px}
    .legend .dot{width:10px;height:10px;border-radius:50%; background:var(--accent2); display:inline-block}

    .upload{margin-top:12px; border:1px dashed #2b3350; padding:10px; border-radius:12px; background:#0f1320}
    .upload input{width:100%}

    .note{color:var(--muted); font-size:12px; margin-top:6px}
    .hr{height:1px; background:#1e2231; margin:12px 0}

    .pill{display:inline-block; font-size:11px; padding:4px 8px; border-radius:12px; background:#0f1320; border:1px solid #26304a; color:#cdd6ea}
  </style>
</head>
<body>
  <div class="app">
    <!-- LEFT PANEL / MENU -->
    <aside class="sidebar">
      <h1>Conveyor Details</h1>
      <div class="sub">Click a marker on the map or choose an asset below.</div>

      <div class="field">
        <label for="assetSelect">Asset</label>
        <select id="assetSelect"></select>
      </div>

      <div class="kpis">
        <div class="k"><div class="t">Line</div><div id="kLine" class="v">–</div></div>
        <div class="k"><div class="t">Section</div><div id="kSection" class="v">–</div></div>
      </div>

      <div class="field"><label>CP Location</label><input id="cp" placeholder="–" /></div>
      <div class="field"><label>Status</label>
        <select id="status">
          <option value="">–</option>
          <option>OK</option>
          <option>Maintenance</option>
          <option>Down</option>
        </select>
      </div>
      <div class="field"><label>Notes</label><textarea id="notes" placeholder="Add notes…"></textarea></div>

      <div class="actions">
        <button class="btn primary" id="saveBtn">Save</button>
        <button class="btn ghost" id="resetBtn">Reset</button>
      </div>

      <div class="hr"></div>

      <div class="field">
        <label>Load data (.csv) <span class="pill">Asset,Section,Line,CP_Location,Status,Notes</span></label>
        <div class="upload"><input id="csvInput" type="file" accept=".csv" /></div>
        <div class="note">Tip: Export from Excel with those exact headers. Values auto‑bind by Asset.</div>
      </div>

      <div class="field">
        <label>Background map image (optional)</label>
        <div class="upload"><input id="imgInput" type="file" accept="image/*" /></div>
        <div class="note">Use a site map PNG/JPG. Markers are positioned by percentage over the image.</div>
      </div>

      <div class="legend"><span class="dot"></span> Running &nbsp; <span class="pill">Click marker to view</span></div>
    </aside>

    <!-- RIGHT: MAP AREA (scrollable) -->
    <main class="mapWrap">
      <div id="map" class="map">
        <img id="bgImg" class="bg" alt="map background" />
        <!-- Markers will be injected here by JS -->
      </div>
    </main>
  </div>

  <script>
    /* ==========================================
       DATA MODEL (edit/replace with your own)
       - assets: table-like data from CSV or default JSON
       - markers: absolute positions (percent of map) per Asset
       ========================================== */

    // Default demo data (replace with your CSV later)
    let assets = [
      { Asset:"402A", Section:"Sorter A", Line:"Inbound 1", CP_Location:"CP-12", Status:"OK", Notes:"" },
      { Asset:"656",  Section:"Sorter B", Line:"Outbound 3", CP_Location:"CP-07", Status:"Maintenance", Notes:"Bearing check" },
      { Asset:"771",  Section:"Spur C",   Line:"Outbound 1", CP_Location:"CP-19", Status:"Down", Notes:"Motor fault" }
    ];

    // Marker coordinates as percentages relative to the map container (0..100)
    // x = left%, y = top%
    let markers = [
      { Asset:"402A", x:15, y:30 },
      { Asset:"656",  x:42, y:54 },
      { Asset:"771",  x:70, y:22 }
    ];

    const els = {
      assetSelect: document.getElementById('assetSelect'),
      kLine: document.getElementById('kLine'),
      kSection: document.getElementById('kSection'),
      cp: document.getElementById('cp'),
      status: document.getElementById('status'),
      notes: document.getElementById('notes'),
      map: document.getElementById('map'),
      bgImg: document.getElementById('bgImg'),
      csvInput: document.getElementById('csvInput'),
      imgInput: document.getElementById('imgInput'),
      saveBtn: document.getElementById('saveBtn'),
      resetBtn: document.getElementById('resetBtn')
    };

    // Populate the Asset dropdown
    function refreshAssetSelect(){
      const cur = els.assetSelect.value;
      els.assetSelect.innerHTML = '';
      const sorted = [...assets].sort((a,b)=>a.Asset.localeCompare(b.Asset));
      for(const row of sorted){
        const opt = document.createElement('option');
        opt.value = row.Asset; opt.textContent = row.Asset;
        els.assetSelect.appendChild(opt);
      }
      if(sorted.length){ els.assetSelect.value = cur && sorted.some(r=>r.Asset===cur)?cur:sorted[0].Asset; }
    }

    // Render markers
    function renderMarkers(){
      // Remove existing
      [...els.map.querySelectorAll('.marker')].forEach(n=>n.remove());
      for(const m of markers){
        const btn = document.createElement('button');
        btn.className = 'marker';
        btn.style.left = m.x + '%';
        btn.style.top  = m.y + '%';
        btn.dataset.asset = m.Asset;
        btn.innerHTML = `<span class="dot"></span>${m.Asset}`;
        btn.addEventListener('click', ()=>selectAsset(m.Asset));
        els.map.appendChild(btn);
      }
      highlightSelected();
    }

    function highlightSelected(){
      const cur = els.assetSelect.value;
      for(const el of els.map.querySelectorAll('.marker')){
        el.classList.toggle('selected', el.dataset.asset===cur);
      }
    }

    function selectAsset(asset){
      if(!asset) return;
      els.assetSelect.value = asset;
      loadDetails(asset);
      highlightSelected();
    }

    function loadDetails(asset){
      const row = assets.find(r=>r.Asset===asset);
      if(!row){
        els.kLine.textContent = '–';
        els.kSection.textContent = '–';
        els.cp.value = '';
        els.status.value = '';
        els.notes.value = '';
        return;
      }
      els.kLine.textContent = row.Line || '–';
      els.kSection.textContent = row.Section || '–';
      els.cp.value = row.CP_Location || '';
      els.status.value = row.Status || '';
      els.notes.value = row.Notes || '';
    }

    function saveDetails(){
      const asset = els.assetSelect.value;
      if(!asset) return;
      let row = assets.find(r=>r.Asset===asset);
      if(!row){ row = {Asset:asset}; assets.push(row); }
      row.Line = els.kLine.textContent;
      row.Section = els.kSection.textContent;
      row.CP_Location = els.cp.value;
      row.Status = els.status.value;
      row.Notes = els.notes.value;
      // Persist to localStorage for demo (export CSV in real use)
      localStorage.setItem('convAssets', JSON.stringify(assets));
    }

    function resetDetails(){
      const asset = els.assetSelect.value;
      loadDetails(asset);
    }

    // Minimal CSV parser (no quotes-in-quotes complexity)
    function parseCsv(text){
      const lines = text.split(/\r?\n/).filter(Boolean);
      if(!lines.length) return [];
      const headers = lines[0].split(',').map(h=>h.trim());
      const out = [];
      for(let i=1;i<lines.length;i++){
        const cols = lines[i].split(',');
        const row = {};
        headers.forEach((h,idx)=> row[h]= (cols[idx]||'').trim());
        out.push(row);
      }
      return out;
    }

    function onCsvUpload(file){
      const reader = new FileReader();
      reader.onload = () => {
        const rows = parseCsv(reader.result);
        if(!rows.length){ alert('No rows found in CSV.'); return; }
        // Expect headers: Asset,Section,Line,CP_Location,Status,Notes
        assets = rows.filter(r=>r.Asset);
        localStorage.setItem('convAssets', JSON.stringify(assets));
        refreshAssetSelect();
        selectAsset(assets[0]?.Asset);
      };
      reader.readAsText(file);
    }

    function onImageUpload(file){
      const url = URL.createObjectURL(file);
      els.bgImg.src = url;
    }

    // Wire events
    els.assetSelect.addEventListener('change', e=>{ selectAsset(e.target.value); });
    els.csvInput.addEventListener('change', e=>{ const f=e.target.files?.[0]; if(f) onCsvUpload(f); });
    els.imgInput.addEventListener('change', e=>{ const f=e.target.files?.[0]; if(f) onImageUpload(f); });
    els.saveBtn.addEventListener('click', saveDetails);
    els.resetBtn.addEventListener('click', resetDetails);

    // INIT
    (function init(){
      // Restore demo data if present
      const stored = localStorage.getItem('convAssets');
      if(stored){ try{ assets = JSON.parse(stored);}catch{} }
      // Background optional: keep empty until user uploads
      refreshAssetSelect();
      renderMarkers();
      if(assets.length){ selectAsset(assets[0].Asset); }
    })();
  </script>
</body>
</html>
